<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация по страницам</title>
    <style>
        /* Общие стили — минималистично, но удобно */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .nav-container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.1), 0 8px 12px -4px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            text-align: center;
            color: #1e293b;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        /* Сетка для кнопок: адаптивная, аккуратная */
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Стиль кнопки-ссылки — точно как кнопка, но семантически <a> */
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.8rem;
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 60px;
            text-decoration: none;
            color: #0f172a;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            line-height: 1.3;
        }

        /* Иконка стрелки справа — для наглядности, что это переход */
        .btn::after {
            content: "→";
            font-size: 1.4rem;
            font-weight: 400;
            color: #64748b;
            transition: transform 0.2s ease, color 0.2s ease;
            margin-left: 1rem;
        }

        /* Ховер-эффект: подсветка, тень, стрелка сдвигается */
        .btn:hover {
            background: #f8fafc;
            border-color: #3b82f6;
            color: #1e3a8a;
            box-shadow: 0 12px 20px -12px rgba(59, 130, 246, 0.3);
        }

        .btn:hover::after {
            transform: translateX(6px);
            color: #3b82f6;
        }

        /* Фокус для доступности */
        .btn:focus-visible {
            outline: 3px solid #3b82f6;
            outline-offset: 3px;
            border-color: #3b82f6;
        }

        /* Дополнительная плашка-подсказка для примера (можно удалить) */
        .hint {
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #64748b;
            text-align: center;
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 80px;
            display: inline-block;
            align-self: center;
            width: fit-content;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <h1>📄 Переход на страницы</h1>
        <div class="button-grid">
                <a href="https://wassss337.github.io/clash-royale/index.html" class="btn">Мини клеш рояль</a>
                <a href="https://wassss337.github.io/TerrariaMini/index.html" class="btn">Пиксельная 2D игра на JAVA</a>
        </div>
    </div>
</body>
</html>
